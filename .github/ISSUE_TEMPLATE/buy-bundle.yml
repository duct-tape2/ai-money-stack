name: AI Money Stack Buyer Help
description: Ask for public-safe Payhip checkout or delivery support
title: "[BUY] AI Money Stack - "
labels: ["buyer-inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for buying AI Money Stack.

        Payhip instant checkout: https://payhip.com/b/RJ63W

        Payhip delivers the ZIP automatically. Email sks7178@gmail.com only if checkout or delivery fails.

        Use this public issue only for public-safe support details. Do not post receipt numbers, screenshots, email addresses, or other payment records.

        Refund/support: 14-day refund if the delivered ZIP cannot be opened, the local tools do not run on supported macOS versions, or a listed deliverable is missing. Use email for private payment or delivery details.

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - AI Money Stack - Payhip $25
        - Repo-to-Revenue Launch Bundle - Payhip $39
    validations:
      required: true

  - type: input
    id: payment_id
    attributes:
      label: Public-safe problem summary
      description: Describe the checkout or delivery problem without posting receipt numbers, screenshots, or payment details.
      placeholder: "Checkout did not complete / delivery email did not arrive / ZIP will not open"
    validations:
      required: true

  - type: input
    id: delivery_email
    attributes:
      label: Private support email sent?
      description: GitHub issues are public. Write "sent" if you emailed support details to sks7178@gmail.com; do not post your email address here.
      placeholder: "sent / not needed"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: Optional notes, region, or delivery constraints
      placeholder: "Optional"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirm
      options:
        - label: I understand Payhip delivers the ZIP automatically after checkout.
          required: true
        - label: I understand support/refund requests should be sent by email if they include private payment or delivery details.
          required: true
