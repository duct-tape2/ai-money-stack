name: Buy Bundle Delivery
description: Send payment confirmation for the AI Money Stack bundle
title: "[BUY] AI Money Stack - "
labels: ["buyer-inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for buying AI Money Stack.

        PayPal: https://www.paypal.me/sks7178/25

        For the private path, email sks7178@gmail.com with payer name/email prefix, payment time, and delivery email.

        Use this public issue only if you are comfortable posting public-safe confirmation details. Do not post full transaction IDs in a public issue. ZIP delivery is within 5 minutes during KST business hours.

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - AI Money Stack - PayPal $25
        - Private AI Starter Kit - KRW 99,000
        - Team setup preorder - KRW 390,000
    validations:
      required: true

  - type: input
    id: payment_id
    attributes:
      label: Public-safe payment confirmation
      description: For PayPal, enter payer name or email prefix plus approximate payment time. For Korean bank/Toss, enter depositor name and transfer time. If you emailed privately, write "email sent" plus payment time. Do not post full transaction IDs.
      placeholder: "PayPal payer name/email prefix + time / email sent + time / 입금자명 + 입금시각"
    validations:
      required: true

  - type: input
    id: delivery_email
    attributes:
      label: Delivery contact
      description: GitHub issues are public. Enter an email you are comfortable posting publicly, or write "sent by email" if you emailed delivery details to sks7178@gmail.com.
      placeholder: "you@example.com / sent by email"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: Optional notes, region, or delivery constraints
      placeholder: "Optional"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirm
      options:
        - label: I understand the bundle is delivered manually after payment confirmation within 5 min during KST business hours.
          required: true
