name: Buy Bundle Delivery
description: Send payment confirmation for the AI Money Stack bundle
title: "[BUY] AI Money Stack - "
labels: ["buyer-inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for buying AI Money Stack.

        PayPal: https://www.paypal.me/sks7178/25

        After payment, submit this issue with your transaction ID. ZIP delivery is within 5 minutes during KST business hours.

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - AI Money Stack - PayPal $25
        - Private AI Starter Kit - KRW 99,000
        - Team setup preorder - KRW 390,000
    validations:
      required: true

  - type: input
    id: payment_id
    attributes:
      label: Payment transaction ID or depositor name
      description: For PayPal, paste the transaction ID. For Korean bank/Toss, enter depositor name and transfer time.
      placeholder: "PayPal transaction ID / 입금자명 + 입금시각"
    validations:
      required: true

  - type: input
    id: delivery_email
    attributes:
      label: Delivery email
      description: Where should the ZIP link be sent?
      placeholder: "you@example.com"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: Optional notes, region, or delivery constraints
      placeholder: "Optional"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirm
      options:
        - label: I understand the bundle is delivered manually after payment confirmation within 5 min during KST business hours.
          required: true
